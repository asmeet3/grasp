[project]
name = "grasp"
version = "1.0.0"
description = "Agentic AI institutional brain — retrieves, indexes, and reasons over company knowledge from Confluence, Jira, SharePoint, Slack, and Notion."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "gitpython>=3.1.40",
    "apscheduler>=3.10.0,<4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "sse-starlette>=2.0.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "itsdangerous>=2.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "bleach>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
    "mypy>=1.11",
    "pytest-cov>=5.0",
    "bandit>=1.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/core", "src/ingestion.py"]
no_site_packages = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src.core", "src.ingestion"]

[tool.coverage.report]
fail_under = 70

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
